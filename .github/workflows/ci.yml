name: Static Calculator CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator regression tests
        run: node --test tests/*.test.cjs
      - name: Check mirrored public assets
        run: cmp index.html public/index.html && cmp styles.css public/styles.css && cmp app.js public/app.js
